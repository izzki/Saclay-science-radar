name: Collecte, tests et publication
on:
  push:
    branches: [main]
    paths-ignore: ['public/data/**', 'data/**', 'package-lock.json']
  schedule:
    - cron: '15 6 * * *'
    - cron: '15 16 * * *'
  workflow_dispatch:
    inputs:
      discovery:
        description: Rechercher de nouvelles sources
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: radar-production
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: |
          npm install --no-audit --no-fund
          python -m pip install -r requirements.txt
      - name: Tests du traitement et de l’interface
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          npm test
      - name: Collecter et découvrir
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISCOVERY: ${{ inputs.discovery }}
        shell: bash
        run: |
          FLAGS=()
          if [ "$SCHEDULE" = '15 16 * * *' ]; then FLAGS+=(--priority); fi
          if [ "$EVENT_NAME" = 'push' ] || [ "$DISCOVERY" = 'true' ] || { [ "$SCHEDULE" = '15 6 * * *' ] && [ "$(date -u +%u)" = '7' ]; }; then FLAGS+=(--discover); fi
          if [ "$EVENT_NAME" = 'push' ] || [ "$(date -u +%d)" = '01' ]; then FLAGS+=(--audit); fi
          if [ "$EVENT_NAME" = 'push' ] && python - <<'PYFRESH'
          import json,sys
          from pathlib import Path
          from datetime import datetime,timezone
          r=json.loads(Path('public/data/run.json').read_text())
          value=r.get('lastSuccessfulCollection')
          fresh=bool(value) and (datetime.now(timezone.utc)-datetime.fromisoformat(value)).total_seconds()<7200
          sys.exit(0 if fresh else 1)
          PYFRESH
          then
            FLAGS=(--reprocess --audit)
          fi
          python -u -m collectors.pipeline "${FLAGS[@]}" --budget 420
      - name: Valider les données et construire le site
        run: |
          python -m collectors.validate
          npm run build
          touch dist/.nojekyll
      - name: Vérification Android dans Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-verification-android
          path: test-results/
          retention-days: 14
      - name: Conserver l’historique et le catalogue
        run: |
          git config user.name 'Saclay Science Radar'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ public/data/ package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: actualiser les événements et la couverture'
            git push
          fi
      - name: Rapport d’exécution
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          c=json.loads(Path('public/data/coverage.json').read_text())
          r=json.loads(Path('public/data/run.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"État : {r.get('status')}\n\n{c['inventory']} sources inventoriées ; {c['automated']} avec événements extraits ; {c['discovered']} découvertes ; {c['events']} événements réels.\n\nExhaustivité globale : inconnue.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-rapports
          path: |
            public/data/
            data/reports/
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publier GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Vérifier le site public et ses données
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PYPUBLIC'
          import json,os,re,time,urllib.request
          from urllib.parse import urljoin
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          def fetch(url):
              with urllib.request.urlopen(url,timeout=20) as response:
                  assert response.status==200
                  return response.read()
          for attempt in range(12):
              try:
                  html=fetch(base).decode()
                  assert 'Saclay Science Radar' in html
                  for asset in re.findall(r'(?:src|href)="([^"]+\.(?:js|css))"',html):
                      assert len(fetch(urljoin(base,asset)))>100
                  events=json.loads(fetch(urljoin(base,'data/events.json')))
                  coverage=json.loads(fetch(urljoin(base,'data/coverage.json')))
                  assert events and len({e['id'] for e in events})==len(events)
                  assert coverage['events']==len(events)
                  print('SITE PUBLIC VÉRIFIÉ',base,len(events),'annonces ;',coverage['automated'],'sources avec extraction validée')
                  break
              except Exception:
                  if attempt==11:raise
                  time.sleep(5)
          PYPUBLIC
